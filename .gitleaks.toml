# Gitleaks configuration for AI Career Assistant.
#
# The CI `security-gates` job runs `gitleaks detect --exit-code=2`, so any
# heuristic "secret" finding fails the build. Our repo has NO real credentials
# committed (the root `.env*` are git-ignored and `.env.example` holds only
# placeholders). The two entries below are known false positives from gitleaks'
# broad `generic-api-key` heuristic; each is scoped to a specific file + rule so
# the scan stays strict everywhere else.

title = "AI Career Assistant gitleaks config"

[extend]
# Extend gitleaks' built-in default rule set (do not replace it).
useDefault = true

[allowlist]
description = "Repo-wide allowlist for known-safe, non-credential test/UI strings"
paths = [
  # Test-only fake JWT signing secret (used to mint tokens in pytest fixtures).
  # Not a real credential; verified absent from any .env.
  '''backend/tests/api/test_e2e_journey\.py''',
  '''backend/tests/security/test_auth\.py''',
  '''backend/tests/security/test_observability\.py''',
  # Frontend UI date-bucket keys (e.g. 'previous7Days') that the generic-api-key
  # rule matches on context alone; they are translation/grouping keys, not keys.
  '''frontend/src/features/chat/Sidebar\.jsx''',
]
regexTarget = "match"
regexes = [
  # Example/placeholder documentation values (never real secrets).
  '''your_[a-z_]+''',
  '''replace_with_[a-z_]+''',
]
