name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Formatting check
        run: python -m ruff format --check backend

      - name: Lint
        run: python -m ruff check backend

      - name: Type check
        run: python -m mypy backend/app

      - name: Unit and integration tests
        run: pytest backend/tests -q

      - name: Coverage
        run: pytest backend/tests --cov=backend/app --cov-report=term-missing -q

      - name: Security scan (bandit + pip-audit)
        run: |
          python -m bandit -r backend/app -q
          python -m pip_audit -r backend/requirements.txt --format columns

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  # CI-01: Secret scanning, migration validation, license validation, Docker build.
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly use the repo's allowlist config (known-safe test/UI
          # strings only). Without it the action still auto-discovers this file,
          # but being explicit avoids surprises if the default ever changes.
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: License validation
        run: |
          python -m pip install license-expression
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          # Verify LICENSE and LICENSES.md exist and are non-empty.
          required = ["LICENSE", "LICENSES.md"]
          missing = [name for name in required if not Path(name).exists()]
          if missing:
              print(f"Missing license files: {missing}", file=sys.stderr)
              sys.exit(1)
          for name in required:
              content = Path(name).read_text(encoding="utf-8").strip()
              if not content:
                  print(f"Empty license file: {name}", file=sys.stderr)
                  sys.exit(1)
          print("License files present and non-empty.")
          PY

      - name: Migration validation
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          # Verify all migration files are valid SQL (basic syntax check).
          migrations = sorted(Path("supabase/migrations").glob("*.sql"))
          if not migrations:
              print("No migrations found.", file=sys.stderr)
              sys.exit(1)
          for migration in migrations:
              content = migration.read_text(encoding="utf-8")
              if not content.strip():
                  print(f"Empty migration: {migration}", file=sys.stderr)
                  sys.exit(1)
              # Basic check: no unbalanced parentheses.
              if content.count("(") != content.count(")"):
                  print(f"Unbalanced parentheses in {migration}", file=sys.stderr)
                  sys.exit(1)
          print(f"Validated {len(migrations)} migration files.")
          PY

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: ai-career-assistant-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: ai-career-assistant-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
